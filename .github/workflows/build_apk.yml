name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create official Android scaffolding
        run: |
          flutter create --platforms=android --org uz.darkmora --project-name darkmora_fandub .

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Copy and rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/darkmora-fandub.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darkmora-fandub-apk
          path: output/darkmora-fandub.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "DarkMora Fandub v1.2.0 (Studio & Dubbers Edition)"
          body: "Official DarkMora Multi-Tenant Fandub Anime Streaming Android APK with Fandub Studio Workspace, Collaborative Kanban Pipeline, Studio Chat, and Dubbers Catalog."
          files: output/darkmora-fandub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
